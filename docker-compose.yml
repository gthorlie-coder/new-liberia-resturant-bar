version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: new_liberia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liberia_user
      POSTGRES_PASSWORD: liberia_pass
      POSTGRES_DB: new_liberia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liberia_user -d new_liberia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: new_liberia_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pgdata:
