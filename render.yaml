## Render Blueprint — deploys the API and a managed PostgreSQL database together.
## Push this repo to GitHub, then in Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: new-liberia-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: new-liberia-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200

databases:
  - name: new-liberia-db
    plan: free
    databaseName: new_liberia
    user: liberia_user
